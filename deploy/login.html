<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f6faf9" />
  <title>登录研究工作台 · 风见 Windcatcher</title>
  <link rel="stylesheet" href="/static/app.css" />
  <style>
    body{min-height:100vh;min-height:100dvh;background:#f6faf9;overflow-x:hidden}
    body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 58% at 18% 24%,rgba(43,179,166,.13),transparent 70%),radial-gradient(ellipse 50% 48% at 86% 12%,rgba(15,118,110,.08),transparent 72%),radial-gradient(ellipse 52% 50% at 72% 94%,rgba(110,178,168,.11),transparent 70%)}
    .page{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:1200px;margin:auto;padding:25px clamp(20px,4vw,52px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:inline-flex;align-items:center;gap:10px;padding:0;color:var(--ink);text-decoration:none}
    .brand img{width:34px;height:34px;display:block}
    .brand strong{font-size:18px;font-weight:650;letter-spacing:.01em}
    .brand span{font-size:13px;color:var(--ink-3);font-weight:500}
    .edition{font-size:12px;color:var(--accent-ink);background:rgba(233,246,243,.9);border:1px solid #d5ece6;padding:7px 11px;border-radius:999px;white-space:nowrap}
    main{flex:1;display:grid;place-items:center;padding:50px 0 64px}
    .login-card{width:min(100%,430px);padding:38px 38px 31px;background:rgba(255,255,255,.88);border:1px solid rgba(211,221,220,.85);border-radius:20px;box-shadow:0 18px 55px rgba(21,64,60,.09),0 2px 8px rgba(21,64,60,.035);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:card-in .42s ease-out both}
    .emblem{width:58px;height:58px;display:grid;place-items:center;margin:0 auto 21px;border-radius:18px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px #d8ede8}
    .emblem img{width:34px;height:34px;display:block}
    h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.025em;text-align:center;line-height:1.3}
    .subtitle{margin:9px 0 27px;color:var(--ink-2);text-align:center;font-size:13px;line-height:1.7}
    .field{margin-top:17px}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:600;color:var(--ink)}
    input{display:block;width:100%;height:47px;padding:0 14px;border:1px solid var(--line-strong);border-radius:10px;background:#fff;outline:none;font-size:14px;transition:border-color .18s,box-shadow .18s}
    input::placeholder{color:var(--ink-3)}
    input:hover{border-color:#aabebb}
    input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.12);outline:none}
    .error{display:flex;align-items:flex-start;gap:9px;margin:0 0 18px;padding:11px 12px;border:1px solid #f0c9c5;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:13px;line-height:1.5}
    .error svg{flex:0 0 17px;margin-top:1px}
    .submit{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;height:48px;margin-top:26px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .18s,transform .18s,box-shadow .18s}
    .submit:hover{background:var(--accent-ink);box-shadow:0 6px 18px rgba(15,118,110,.18)}
    .submit:active{transform:translateY(1px)}
    .submit:focus-visible{outline:3px solid #96d2c7;outline-offset:3px}
    .submit:disabled{opacity:.72;cursor:wait;transform:none;box-shadow:none}
    .submit svg{width:17px;height:17px}
    .form-hint{margin:15px 0 0;color:var(--ink-3);text-align:center;font-size:12px;line-height:1.6}
    .divider{height:1px;margin:25px 0 19px;background:var(--line)}
    .deployment-note{display:flex;gap:9px;align-items:flex-start;margin:0;color:var(--ink-2);font-size:12px;line-height:1.7}
    .deployment-note svg{flex:0 0 16px;margin-top:2px;color:var(--accent)}
    footer{display:flex;justify-content:space-between;gap:15px;color:var(--ink-3);font-size:12px;line-height:1.6}
    @keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){.page{padding:18px 18px 22px}.brand span{display:none}main{padding:34px 0 42px}.login-card{padding:31px 24px 26px;border-radius:17px}h1{font-size:22px}footer{display:block;text-align:center}footer span+span{display:block;margin-top:4px}}
    @media(prefers-reduced-motion:reduce){.login-card{animation:none}input,.submit{transition:none}}
  </style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="风见首页"><img src="/static/assets/logo-badge.svg" alt="" /><strong>风见</strong><span>Windcatcher</span></a>
    <span class="edition">研究预览版</span>
  </header>
  <main>
    <section class="login-card" aria-labelledby="login-title">
      <div class="emblem"><img src="/static/assets/logo-badge.svg" alt="" /></div>
      <h1 id="login-title">进入研究工作台</h1>
      <p class="subtitle">使用项目成员账号登录，继续气道建模与计算复核。</p>
      <!--LOGIN_ERROR-->
      <form method="post" action="/login" id="login-form">
        <div class="field"><label for="username">账号</label><input id="username" name="username" type="text" autocomplete="username" placeholder="请输入项目账号" maxlength="128" required autofocus /></div>
        <div class="field"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" maxlength="256" required /></div>
        <button class="submit" type="submit" id="login-submit"><span>登录工作台</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
      </form>
      <p class="form-hint">病例、模型、计算任务和报告需要账号密码。</p>
      <div class="divider" aria-hidden="true"></div>
      <p class="deployment-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg><span><!--DEPLOYMENT_NOTE--></span></p>
    </section>
  </main>
  <footer><span>空穴来风团队 · Windcatcher</span><span>研究原型，仅用于建模与结果复核，不用于诊断或治疗决策。</span></footer>
</div>
<script>
  const form = document.getElementById('login-form');
  const submit = document.getElementById('login-submit');
  form.addEventListener('submit', () => {
    submit.disabled = true;
    submit.querySelector('span').textContent = '正在验证…';
    submit.setAttribute('aria-busy', 'true');
  });
</script>
</body>
</html>
